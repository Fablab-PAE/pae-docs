<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img">
<title>Correct</title>
<rect width="800" height="420" rx="12" fill="#ffffff"/>
<rect x="20" y="20" width="240" height="380" rx="10" fill="#ffffff" stroke="#1e8e3e" stroke-width="3"/>
<rect x="35" y="250" width="210" height="22" fill="#2f80c9"/>
<rect x="35" y="272" width="210" height="8" fill="#f2c94c"/>
<rect x="35" y="280" width="210" height="40" fill="#f4f1ea" stroke="#c9c2b2"/>
<rect x="138" y="250" width="4" height="40" fill="#ffffff"/>
<path d="M126 120 L154 120 L154 230 L142 290 L138 290 L126 230 Z" fill="#cfd6dd" stroke="#1f2933" stroke-width="2"/>
